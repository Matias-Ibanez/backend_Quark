name: lienzo
services:
  studio:
    build: .
    init: true
    ports:
      - "127.0.0.1:${STUDIO_PORT:-8011}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      QUARK_POST_REASONING: ${QUARK_POST_REASONING:-off}
      QUARK_AUTH_DIR: /auth
      WEB_PORT: ${FRONTEND_PORT:-8010}
      HERMES_BASE_URL: http://hermes:8642/v1
      HERMES_API_KEY: ${HERMES_API_KEY:-lienzo-local-development-key}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-}
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-}
      SHORTS_BASE_URL: http://shorts:8080
      SHORTS_API_KEY: ${SHORTS_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
    volumes:
      - studio-data:/data
      - studio-auth:/auth
    shm_size: 1gb
    mem_limit: 1536m
    cpus: 2
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      default: {}
      quark-shared: {}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
  hermes:
    build: ./hermes
    depends_on:
      studio:
        condition: service_healthy
    command: ["gateway", "run"]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${HERMES_API_KEY:-lienzo-local-development-key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      HERMES_WRITE_SAFE_ROOT: /workspace
      U2NET_HOME: /opt/data/rembg-models
      QUARK_REMOTION_CONCURRENCY: ${QUARK_REMOTION_CONCURRENCY:-2}
    volumes:
      - hermes-data:/opt/data
      - ./hermes/config.yaml:/opt/data/config.yaml:ro
      - ./hermes/skills/quark-marketing:/opt/data/skills/quark-marketing:ro
      - ./hermes/skills/quark-narration:/opt/data/skills/quark-narration:ro
      - ./hermes/skills/manimce-best-practices:/opt/data/skills/manimce-best-practices:ro
      - ./hermes/skills/remotion-best-practices:/opt/data/skills/remotion-best-practices:ro
      - ./hermes/skills/quark-documents:/opt/data/skills/quark-documents:ro
      - ./hermes/skills/quark-static-post:/opt/data/skills/quark-static-post:ro
      - ./hermes/skills/quark-style-editorial:/opt/data/skills/quark-style-editorial:ro
      - ./hermes/skills/quark-style-product:/opt/data/skills/quark-style-product:ro
      - ./hermes/skills/quark-style-typographic:/opt/data/skills/quark-style-typographic:ro
      - studio-data:/workspace
    shm_size: 1gb
    mem_limit: 6g
    cpus: 4
    restart: unless-stopped
  shorts:
    image: ghcr.io/harry0703/moneyprinterturbo:1.3.7@sha256:999fbf91934e763a6405b4aecce9a2acaa84c76d0dcae39cf2cf170e9d530889
    init: true
    command: ["sh", "-c", "python /opt/quark/configure.py && python main.py"]
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      SHORTS_API_KEY: ${SHORTS_API_KEY:-}
    volumes:
      - shorts-data:/MoneyPrinterTurbo/storage
      - ./mpt/configure.py:/opt/quark/configure.py:ro
    mem_limit: 4g
    cpus: 4
    shm_size: 1gb
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes:
  studio-data:
  studio-auth:
  hermes-data:
  shorts-data:

networks:
  quark-shared:
    name: quark-shared
